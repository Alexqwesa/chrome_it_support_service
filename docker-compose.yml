services:
  debug-relay:
    image: ${API_IMAGE:-softapp.vietsov.com.vn:5443/chrome-it-support-service:${TAG:-dev}}
    build: .
    container_name: debug-relay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTHORIZED_KEYS_FILE: /data/authorized_keys
      SSHD_RELOAD_SIGNAL_FILE: /run/relay-control/reload-sshd
    ports:
      # Backend HTTP for nginx. Keep loopback-only in production.
      - "${SERVER_HTTP_PUBLISH_BIND:-127.0.0.1}:${SERVER_HTTP_PUBLISH_PORT:-9998}:${SERVER_HTTP_PORT:-9998}"
      # SSH local-forward relay. ssh-relay shares this service's network namespace.
      - "${SSH_RELAY_PUBLISH_BIND:-0.0.0.0}:${SSH_RELAY_PORT:-2223}:22"
      - "127.0.0.1:18081:8081" # reserved for a future separate admin listener
      - "127.0.0.1:41000-41049:41000-41049"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - "${SSH_AUTHORIZED_KEYS_PATH:-./deploy/authorized_keys}:/data/authorized_keys"
      - ssh_control:/run/relay-control
    tmpfs:
      - /tmp

  ssh-relay:
    build:
      context: .
      dockerfile: Dockerfile.ssh-relay
    container_name: ssh-relay
    restart: unless-stopped
    depends_on:
      - debug-relay
    network_mode: "service:debug-relay"
    environment:
      SSHD_RELOAD_SIGNAL_FILE: /run/relay-control/reload-sshd
    volumes:
      - "${SSH_AUTHORIZED_KEYS_PATH:-./deploy/authorized_keys}:/home/debug-tunnel/.ssh/authorized_keys:ro"
      - "./deploy/ssh_host_keys:/etc/ssh/host_keys"
      - ssh_control:/run/relay-control
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /run
      - /tmp

volumes:
  ssh_control:
