services:
  debug-relay:
    build: .
    container_name: debug-relay
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Expose the read-only connection list on the local network by default.
      # Set SERVER_HTTP_PUBLISH_BIND=127.0.0.1 if nginx is the only frontend.
      - "${SERVER_HTTP_PUBLISH_BIND:-0.0.0.0}:18080:8080"
      - "127.0.0.1:18081:8081" # reserved for a future separate admin listener
      - "127.0.0.1:41000-41049:41000-41049"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
